[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hubei-transport-law-assistant"
version = "0.1.0"
description = "湖北交通运输法规与裁量助手：可溯源检索、DeepSeek RAG 与事实补问"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic-settings>=2.6,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]
pdf = ["pypdf>=5,<7"]
ingest = ["pypdf>=5,<7", "langchain-core>=1.0,<2", "langchain-text-splitters>=1.0,<2"]
vectors = ["chromadb>=1.5,<2"]

[project.scripts]
transport-law = "transport_law.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
transport_law = ["web/*.html", "web/*.css", "web/*.js", "web/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

