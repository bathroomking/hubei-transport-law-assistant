<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#173d33">
  <meta name="description" content="用自己的话提问，了解湖北交通法规与裁量依据，查看引用原文和官方出处。">
  <title>湖北交通法规助手</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/styles.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <svg class="icon-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M12 5c-3-2-6-2-9-1v15c3-1 6-1 9 1 3-2 6-2 9-1V4c-3-1-6-1-9 1Zm0 0v15M6 8h3m-3 4h3m6-4h3m-3 4h3"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M4 12h16m-6-6 6 6-6 6"/></symbol>
    <symbol id="i-external" viewBox="0 0 24 24"><path d="M14 3h7v7m0-7L11 13m-1-9H5a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h13a2 2 0 0 0 2-2v-5"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
  </svg>
  <a class="skip-link" href="#main-content">跳转到主要内容</a>
  <header class="site-header">
    <a class="brand" href="/" aria-label="湖北交通法规助手首页"><img src="/static/favicon.svg" alt="" width="36" height="36"><span>湖北交通<span class="brand-detail">法规助手</span></span></a>
    <button id="refresh-health" class="service-status" type="button" title="刷新服务状态"><span id="service-dot" class="status-dot pending" aria-hidden="true"></span><span id="service-label" role="status">正在连接</span></button>
  </header>
  <main id="main-content" tabindex="-1">
    <noscript><div class="notice error">请启用 JavaScript 后使用在线问答。</div></noscript>
    <section class="intro" aria-labelledby="page-title">
      <span class="eyebrow">交通法规 · 处理依据 · 裁量参考</span>
      <h1 id="page-title">有交通法规问题？<br><span>直接说说你的情况。</span></h1>
      <p>用自己的话提问，回答与出处一起看。</p>
    </section>
    <form id="ask-form" class="question-card">
      <label for="ask-question">你想了解什么？</label>
      <textarea id="ask-question" name="question" rows="4" minlength="2" maxlength="2000" required placeholder="例如：在湖北一段普通公路上，施工队没办许可就挖沟埋管。这种情况该怎么处理，有什么依据？" aria-describedby="ask-hint ask-count"></textarea>
      <div class="question-toolbar"><span id="ask-count" class="char-count">0 / 2000</span><div class="submit-group"><span class="keyboard-hint">Ctrl / ⌘ + Enter</span><button id="send-question" type="submit" class="button primary"><span>发送问题</span><svg class="icon" aria-hidden="true"><use href="#i-arrow"/></svg></button></div></div>
      <div class="examples" aria-label="提问示例"><span>试着问</span><button type="button" data-example="在湖北一段普通公路上，施工队没办许可就挖沟埋管。这种情况该怎么处理，有什么依据？">公路上挖沟，怎么办？</button><button type="button" data-example="占用公路施工需要办什么手续？请给我相关规定和原文。">占道施工需要哪些手续？</button><button type="button" data-example="在湖北普通公路上未经许可占道施工，想了解处罚和裁量依据，还需要核实哪些情况？">处罚前还要核实什么？</button></div>
    </form>
    <p id="ask-hint" class="input-hint">每次提问独立处理。补充情况时，请把原有背景和新增信息写在同一个问题里。</p>
    <div id="ask-results" class="results" role="region" aria-label="回答与依据" aria-live="polite" aria-busy="false">
      <div class="empty-state"><svg class="icon" aria-hidden="true"><use href="#i-book"/></svg><p>发送后，这里会显示在线回答、需要补充的信息和引用原文。</p></div>
    </div>
    <footer class="page-footer">依据已收录资料回答 · 引用可查看原文与出处 · 个案适用需核实</footer>
  </main>
  <dialog id="detail-dialog" aria-labelledby="dialog-title"><div class="dialog-header"><span id="dialog-kicker" class="eyebrow">原文与出处</span><button type="button" id="close-dialog" class="icon-button" aria-label="关闭原文" autofocus><svg class="icon" aria-hidden="true"><use href="#i-close"/></svg></button></div><div id="dialog-content"></div></dialog>
</body>
</html>
